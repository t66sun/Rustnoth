[package]
name = "rustnoth_gui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
engine_lite = { path = "../engine_lite" }
macroquad = { version = "=0.4.16", default-features = false }
# Original unit portraits are WebP. Enable the decoder in Macroquad's image crate.
image = { version = "0.24", default-features = false, features = ["webp"] }
